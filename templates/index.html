{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OnlineChat</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>

<!-- Icons, drawn for this app: 24×24, stroked with the text colour. Used as <svg><use href="#i-…"/></svg>. -->
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.8 4-5.8 7.5-5.8s6.3 2 7.5 5.8"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.5 3.5 3.5 10.5l7 3 3 7z"/><path d="M20.5 3.5l-10 10"/></symbol>
</svg>

<!-- ───────────── Auth ───────────── -->
<section id="auth" class="auth">
  <div class="auth-card">
    <h1>OnlineChat</h1>

    <div class="tabs">
      <button class="tab is-active" data-mode="login">Log in</button>
      <button class="tab" data-mode="register">Register</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <label>
        Phone number
        <input name="phone_number" type="tel" required placeholder="+998 90 123 45 67"
               autocomplete="tel">
      </label>

      <label class="only-register" hidden>
        Name
        <input name="first_name" type="text" placeholder="Ali" autocomplete="given-name">
      </label>

      <label>
        Password
        <input name="password" type="password" required autocomplete="current-password">
      </label>

      <label class="only-register" hidden>
        Confirm password
        <input name="confirm_password" type="password" autocomplete="new-password">
      </label>

      <p id="auth-error" class="error" hidden></p>
      <button type="submit" class="primary" id="auth-submit">Log in</button>
    </form>
  </div>
</section>

<!-- ───────────── App ───────────── -->
<main id="app" class="app" hidden>

  <aside class="sidebar">
    <header class="sidebar-head">
      <button id="open-menu" class="icon-btn" title="Menu" aria-label="Menu" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <!-- The list's title says how the connection is: "Chats" when it's up (F-03). -->
      <h1 class="sidebar-title"><span id="conn-state" class="conn" role="status">Connecting…</span></h1>
    </header>

    <form id="lookup-form" class="lookup">
      <input name="phone_number" type="tel" placeholder="Find someone by phone…" required>
      <button type="submit" class="icon-btn" title="Search" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>
    </form>
    <p id="lookup-msg" class="lookup-msg" hidden></p>

    <ul id="chat-list" class="chat-list"></ul>
    <button id="more-chats" class="load-older" hidden>Show more chats</button>
    <p id="chat-empty" class="empty">No conversations yet.<br>Search for a phone number to start one.</p>
  </aside>

  <section class="pane">
    <div id="pane-empty" class="empty pane-empty">Pick a conversation</div>

    <div id="pane-chat" hidden>
      <!-- Header and composer stick to the edges of the scrolling area, so messages pass under their glass. -->
      <div id="messages" class="messages">
        <header class="pane-head material">
          <button id="back" class="icon-btn only-narrow" title="Back" aria-label="Back"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
          <img id="peer-avatar" class="avatar" alt="">
          <div>
            <strong id="peer-name"></strong>
            <span id="peer-status" class="muted status"></span>
            <span id="peer-conn" class="muted status" hidden></span>
          </div>
        </header>

        <button id="load-older" class="load-older" hidden>Load older messages</button>
        <div id="message-rows"></div>

        <div class="composer-bar material">
          <form id="send-form" class="composer">
            <textarea id="composer-input" rows="1" placeholder="Write a message…"
                      autocomplete="off"></textarea>
            <button type="submit" class="primary send" title="Send" aria-label="Send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
          </form>
          <p id="send-error" class="error composer-error" hidden></p>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ───────────── ☰ Menu: a drawer from the left ───────────── -->
<dialog id="menu" class="drawer" aria-label="Menu">
  <div class="drawer-scrim"></div>
  <nav class="drawer-panel">
    <header class="drawer-me">
      <img id="me-avatar" class="avatar avatar-lg" alt="">
      <strong id="me-name">…</strong>
      <span id="me-phone" class="muted"></span>
    </header>
    <button id="open-profile" class="drawer-item"><svg class="icon" aria-hidden="true"><use href="#i-person"/></svg>Profile</button>
    <button id="logout" class="drawer-item"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>Log out</button>
  </nav>
</dialog>

<!-- ───────────── Profile dialog ───────────── -->
<dialog id="profile-dialog">
  <form id="profile-form" method="dialog">
    <h2>Your profile</h2>
    <label>
      Name
      <input name="first_name" type="text" required>
    </label>
    <label>
      Avatar
      <input name="avatar" type="file" accept="image/*">
    </label>
    <p class="muted small">Your phone number can't be changed here.</p>
    <p id="profile-error" class="error" hidden></p>
    <menu>
      <button type="button" id="profile-cancel">Cancel</button>
      <button type="button" id="profile-save" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
